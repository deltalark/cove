[workspace]
resolver = "2"
members = ["crates/proto", "crates/guest", "crates/core", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/deltalark/cove"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
cove-proto = { path = "crates/proto" }
cove-core = { path = "crates/core" }

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"
