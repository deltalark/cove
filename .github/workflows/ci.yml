name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace
      - run: cargo test --workspace

  guest:
    name: Guest agent (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [aarch64, x86_64]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: pip install ziglang && cargo install cargo-zigbuild --locked
      - run: cargo zigbuild --release -p cove-guest --target ${{ matrix.arch }}-unknown-linux-musl
      - run: cp target/${{ matrix.arch }}-unknown-linux-musl/release/cove-guest cove-guest-linux-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: cove-guest-linux-${{ matrix.arch }}
          path: cove-guest-linux-${{ matrix.arch }}

  cli-linux:
    name: Linux CLI (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [aarch64, x86_64]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: pip install ziglang && cargo install cargo-zigbuild --locked
      - run: cargo zigbuild --release -p cove --target ${{ matrix.arch }}-unknown-linux-musl
      - run: cp target/${{ matrix.arch }}-unknown-linux-musl/release/cove cove-linux-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: cove-linux-${{ matrix.arch }}
          path: cove-linux-${{ matrix.arch }}

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, guest, cli-linux]
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p cove
      - uses: actions/download-artifact@v4
        with:
          path: guest
          merge-multiple: true
      # Every tarball holds cove/cove and the guest agent for its processor, which is
      # what scripts/install.sh expects.
      - name: Package
        run: |
          mkdir -p dist/cove
          cp target/release/cove dist/cove/
          cp guest/cove-guest-linux-aarch64 dist/cove/
          tar -C dist -czf cove-${GITHUB_REF_NAME}-macos-arm64.tar.gz cove
          for arch in aarch64 x86_64; do
            rm -rf dist && mkdir -p dist/cove
            cp guest/cove-linux-$arch dist/cove/cove
            cp guest/cove-guest-linux-$arch dist/cove/
            chmod 755 dist/cove/*
            tar -C dist -czf cove-${GITHUB_REF_NAME}-linux-$arch.tar.gz cove
          done
          shasum -a 256 cove-*.tar.gz > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            cove-*.tar.gz
            SHA256SUMS
            guest/cove-guest-linux-*
